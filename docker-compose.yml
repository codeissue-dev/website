name: codeissue

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeissue}
      POSTGRES_USER: ${POSTGRES_USER:-codeissue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeissue-local-password}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-codeissue} -d ${POSTGRES_DB:-codeissue}',
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeissue}:${POSTGRES_PASSWORD:-codeissue-local-password}@postgres:5432/${POSTGRES_DB:-codeissue}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
      AUTH_TRUST_HOST: 'true'
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@codeissue.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8080}
      BACKEND_API_TOKEN: ${BACKEND_API_TOKEN:-}
      BACKEND_WS_URL: ${BACKEND_WS_URL:-ws://host.docker.internal:8080/ws}
      BACKEND_WS_TICKET_PATH: ${BACKEND_WS_TICKET_PATH:-/ws/ticket}
      INTEGRATION_WEBHOOK_SECRET: ${INTEGRATION_WEBHOOK_SECRET:-local-webhook-secret}
    ports:
      - '${APP_PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm run db:migrate && npm run dev"

  seed:
    build:
      context: .
      target: development
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeissue}:${POSTGRES_PASSWORD:-codeissue-local-password}@postgres:5432/${POSTGRES_DB:-codeissue}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@codeissue.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
    command: npm run db:seed

volumes:
  postgres_data:
  app_node_modules:
