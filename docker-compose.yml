name: codeissue-website

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeissue}
      POSTGRES_USER: ${POSTGRES_USER:-codeissue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeissue-local-password}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-codeissue} -d ${POSTGRES_DB:-codeissue}',
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeissue}:${POSTGRES_PASSWORD:-codeissue-local-password}@postgres:5432/${POSTGRES_DB:-codeissue}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-production}
      AUTH_TRUST_HOST: 'true'
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8080}
      WEBSITE_API_TOKEN: ${WEBSITE_API_TOKEN:-local-backend-service-token-change-before-production}
      TELEGRAM_API_TOKEN: ${TELEGRAM_API_TOKEN:-local-telegram-service-token-change-before-production}
      BACKEND_WS_URL: ${BACKEND_WS_URL:-ws://localhost:8080/ws}
      BACKEND_WS_TICKET_PATH: ${BACKEND_WS_TICKET_PATH:-/ws/ticket}
      INTEGRATION_WEBHOOK_SECRET: ${INTEGRATION_WEBHOOK_SECRET:-local-webhook-secret}
    ports:
      - '${APP_PORT:-3000}:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: npm run dev
  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeissue}:${POSTGRES_PASSWORD:-codeissue-local-password}@postgres:5432/${POSTGRES_DB:-codeissue}
      WEBSITE_API_TOKEN: ${WEBSITE_API_TOKEN:-local-backend-service-token-change-before-production}
      TELEGRAM_API_TOKEN: ${TELEGRAM_API_TOKEN:-local-telegram-service-token-change-before-production}
      REALTIME_SIGNING_SECRET: ${REALTIME_SIGNING_SECRET:-local-realtime-signing-secret-change-before-production}
      DEFAULT_WORKSPACE_SLUG: codeissue
      BACKEND_WS_PATH: /ws
      BACKEND_ALLOWED_ORIGINS: ${BACKEND_ALLOWED_ORIGINS:-http://localhost:3000}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      PORT: 8080
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
  migrate:
    build:
      context: ../backend
      target: production
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeissue}:${POSTGRES_PASSWORD:-codeissue-local-password}@postgres:5432/${POSTGRES_DB:-codeissue}
      WEBSITE_API_TOKEN: ${WEBSITE_API_TOKEN:-local-backend-service-token-change-before-production}
      TELEGRAM_API_TOKEN: ${TELEGRAM_API_TOKEN:-local-telegram-service-token-change-before-production}
      REALTIME_SIGNING_SECRET: ${REALTIME_SIGNING_SECRET:-local-realtime-signing-secret-change-before-production}
    command: npm run db:migrate

  seed:
    build:
      context: .
      target: development
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeissue}:${POSTGRES_PASSWORD:-codeissue-local-password}@postgres:5432/${POSTGRES_DB:-codeissue}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
    command: npm run db:seed

volumes:
  postgres_data:
  app_node_modules:
